id: TC-016
name: 해외 호가 잘못된 거래소 코드
description: NH-004(해외 현재가)와 같은 문제가 해외 호가에도 있는지 본다. 같은 현상이면 새로 제보하지 말고 NH-004 에 추가한다.
tags: [시세, negative]
steps:
  - name: 올바른 거래소 코드로 조회 (대조군)
    api: overseas_bid-price
    body: {exch_cd: FCME, sym: ZNZ26}
    expect:
      - status: 200
      - field: {path: last_pric, not_empty: true}
  - name: 없는 거래소 코드로 조회
    api: overseas_bid-price
    body: {exch_cd: FCMEX, sym: ZNZ26}
    expect:
      - status: 4xx
      - field: {path: errorCode, not_empty: true}
