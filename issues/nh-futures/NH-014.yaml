id: NH-014
title: 해외 차트(일봉·분봉) 조회 종료일을 기본값(99999999)으로 두면 시작일 inq_strt_dt 가 무시됨
apis:
- overseas_chart-daily
- overseas_chart-minute
team: team-07
first_seen: '2026-11-19'
reported_at: null
answered_at: null
report_status: 발견
conclusion: null
symptom: |
  종료일(inq_ed_dt)을 날짜로 주면 시작일이 적용되지만, 기본값 99999999 로 두면 시작일이 무시되고 데이터 맨 처음까지 온다. 모두 HTTP 200, 오류 코드 없음.
  - 일봉 (FCME ZNZ26, cidx_yn 0) 시작 20261101 / 종료 99999999 → 172봉, 11-18 ~ 03-24 (상장 이후 전체)
  - 일봉 시작 20261101 / 종료 20261231 → 13봉, 11-18 ~ 11-02 (시작일 적용)
  - 연결 일봉 (cidx_yn 1) 시작 20230112 / 종료 99999999 → nxt_key 를 따라가면 13페이지 7,026봉, 1998-09-28 까지
  - 5분봉 시작 20261117 000000 / 종료 99999999 235959 → 43페이지 20,983봉, 03-30 까지
  - 5분봉 시작 20261117 000000 / 종료 20261119 235959 → 2페이지 604봉, 11-17 00:00 까지 (시작일 적용)
  비교: 국내_차트(일)은 시작 20261101 / 종료 99999999 로도 11-02 에서 끝남 (13봉)
  재현 요청: {"exch_cd":"FCME","sym":"ZNZ26","inq_strt_dt":"20261101","inq_ed_dt":"99999999","req_qty":"2000","cidx_yn":"0","nxt_key":"99999999"} 과 같은 요청에서 inq_ed_dt 만 20261231 로 바꾼 것을 비교
  기대 결과: 종료일이 기본값이어도 시작일 이전 봉은 오지 않고, 시작일에 닿으면 마지막 페이지로 끝나야 함
  영향: 명세 기본값대로 종료일을 비워 두면 필요한 기간만 받을 수 없음 (2023년 이후만 원해도 13번 호출, 1998년까지 받음). 국내 기준으로 만든 코드가 해외에서 과거 데이터까지 받음
  개선 제안: 종료일이 기본값이어도 시작일 적용 (국내와 같게). 설계상 종료일을 줘야 적용된다면 inq_strt_dt 설명에 조건을 명시
  확인일: 2026-11-19 모의 서버
  재현 기록: issues/nh-futures/evidence/NH-014/README.md
nh_answer: null
rules:
- 해외 차트는 시작일을 쓰려면 종료일도 날짜로 준다. 그래도 받은 뒤 날짜로 다시 거른다 (NH-016)
pending:
- 시작일에 닿았을 때 nxt_key 가 어떻게 와야 하는지 NH에 질문
